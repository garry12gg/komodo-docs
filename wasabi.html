<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Deviled Egg Russian Roulette v1.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none}
body{background:#171310;font-family:Georgia,'Times New Roman',serif;color:#d8cbb4}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.flick{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 40%,rgba(255,180,90,0.06),transparent 60%);animation:f 5.2s ease-in-out infinite}
@keyframes f{0%,100%{opacity:.7}22%{opacity:.45}41%{opacity:.85}63%{opacity:.5}78%{opacity:.9}}
.vg{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,0.55) 100%)}
.pr{position:fixed;z-index:1;pointer-events:none}
#sy{width:54px;height:22px;right:14%;top:68%;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#241a12,#0d0906 70%)}
#cn{right:18%;top:22%;width:26px;height:64px;background:linear-gradient(180deg,#e8dcc0,#c9b894);border-radius:6px 6px 4px 4px}
.sc{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;width:100%}
.hi{display:none!important}
h1{font-size:34px;letter-spacing:2px;color:#e8dcc0;text-shadow:0 2px 12px rgba(0,0,0,.8);line-height:1.2}
.su{margin-top:12px;font-size:15px;color:#9a8c74;font-style:italic;max-width:300px;line-height:1.5}
.go{margin-top:26px;font-size:13px;color:#6f6350;letter-spacing:3px;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
#hr{position:relative;width:110px;height:87px;margin:18px auto 4px;cursor:default}
#hu{position:fixed;top:46px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:4;font-size:14px;color:#b5a689;letter-spacing:1px}
#lv{color:#c96a5a;font-size:16px;letter-spacing:3px}
#pl{position:fixed;top:76px;left:0;right:0;text-align:center;z-index:4;font-size:12px;color:#6f6350;letter-spacing:4px;text-transform:uppercase}
#tb{position:relative;width:min(92vw,380px);aspect-ratio:1;z-index:2;margin:6px 0}
#pt{position:absolute;inset:6% 8% 4% 8%;border-radius:50%;background:radial-gradient(ellipse at 42% 38%,#3a3128,#221c15 70%,#17120d);border:1px solid rgba(255,255,255,.04)}
.eg{position:absolute;width:88px;height:70px;cursor:pointer;transform-origin:50% 90%;transition:transform .18s ease;z-index:2}
.eg:active{transform:scale(.94)}
.eg .w{position:absolute;inset:0;border-radius:50% 50% 47% 53%/58% 58% 42% 42%;background:radial-gradient(ellipse at 36% 28%,#fdf8ec,#e9dcc0 72%,#d6c69f)}
.eg .dl{position:absolute;left:50%;top:52%;width:48px;height:36px;transform:translate(-50%,-50%);border-radius:50% 50% 46% 54%/62% 62% 38% 38%;background:radial-gradient(circle at 42% 32%,#f9e98f,#e2c24d 78%,#c9a83a);border:1px solid rgba(160,130,30,.25)}
.eg .pk{position:absolute;left:50%;top:40%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#e07b52,#a84328)}
.fc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:16px;z-index:3;pointer-events:none}
.fc .ey{position:absolute;top:0;width:7px;height:9px;border-radius:50%;background:#3a2c1c}
.fc .l{left:1px}.fc .r{right:1px}
.fc .pu{position:absolute;bottom:1px;left:1px;width:4px;height:5px;border-radius:50%;background:#171007}
.fc .li{position:absolute;top:0;left:-1px;width:9px;height:4px;border-radius:0 0 5px 5px;background:#8a7a58;opacity:.85;animation:bl 6.2s infinite;transform-origin:top center}
@keyframes bl{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.08)}}
.fc .mo{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:10px;height:2px;background:#3a2c1c;border-radius:1px}
.eg.hp .ey{background:transparent}
.eg.hp .ey::before,.eg.hp .ey::after{content:'';position:absolute;top:3px;left:0;width:9px;height:2px;background:#3a2c1c;border-radius:1px}
.eg.hp .l::before,.eg.hp .l::after{transform:rotate(-20deg)}.eg.hp .r::before,.eg.hp .r::after{transform:rotate(20deg)}
.eg.hp .mo{width:12px;height:3px;background:transparent;border-bottom:2px solid #3a2c1c;border-radius:0 0 4px 4px;bottom:-1px}
.eg.ot .ey{background:transparent}
.eg.ot .ey::before,.eg.ot .ey::after{content:'';position:absolute;top:1px;left:-1px;width:9px;height:2px;background:#3a2c1c;border-radius:1px}
.eg.ot .l::before,.eg.ot .l::after{left:0}
.eg.ot .ey::before{transform:rotate(45deg)}.eg.ot .ey::after{transform:rotate(-45deg)}
.eg.ot .mo{width:14px;height:8px;background:transparent;border-bottom:2px solid #3a2c1c;border-radius:0 0 6px 6px;bottom:-3px}
.eg.ot .pu{opacity:0}
.eg.en{animation:nm .4s ease forwards;pointer-events:none}
@keyframes nm{0%{transform:translateY(0) scale(1);opacity:1}40%{transform:translateY(-26px) scale(1.06);opacity:1}100%{transform:translateY(-14px) scale(.1);opacity:0}}
.eg.sh{animation:sk .45s ease;pointer-events:none}
@keyframes sk{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,2px) rotate(-6deg)}30%{transform:translate(6px,-3px) rotate(5deg)}45%{transform:translate(-5px,3px) rotate(-4deg)}60%{transform:translate(5px,2px) rotate(4deg)}75%{transform:translate(-3px,-2px) rotate(-2deg)}}
.eg.dd{transform:scale(0)!important;transition:transform .35s ease .2s;opacity:0}
.sp{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(circle at 40% 35%,#ffdf8a,#ff7a2a 65%,rgba(255,90,20,0));animation:sq .7s ease-out forwards}
@keyframes sq{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0.2);opacity:0}}
.pf{position:absolute;border-radius:50%;pointer-events:none;z-index:3;background:rgba(230,220,190,0.4);animation:pq 1.1s ease-out forwards}
@keyframes pq{0%{transform:translate(0,0) scale(1);opacity:0.6}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
#mg{position:fixed;bottom:8%;left:0;right:0;text-align:center;z-index:4;font-style:italic;font-size:16px;color:#d8cbb4;min-height:24px}
#mg.bg{font-size:26px;color:#e0794f;letter-spacing:1px}
#fl{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,120,40,.55),rgba(120,20,0,.35));opacity:0}
#fl.on{animation:fy .5s ease}
@keyframes fy{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.sa{animation:ask .4s ease}
@keyframes ask{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
.st{font-size:18px;margin-top:14px;color:#b5a689}
.ll{font-size:11px;color:#9a8c74;letter-spacing:2px;margin-top:7px}
.ls{margin-top:14px;font-size:13px;color:#c96a5a;font-style:italic;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
<div class="vg"></div>
<div class="flick"></div>
<div class="pr" id="sy"></div>
<div class="pr" id="cn"></div>
<div id="fl"></div>

<div id="ts" class="sc">
<div id="hr" class="eg"><div class="w"></div><div class="dl"><span class="pk"></span></div><div class="fc"><div class="ey l"><div class="pu"></div><div class="li"></div></div><div class="ey r"><div class="pu"></div><div class="li"></div></div><div class="mo"></div></div></div>
<h1>DEVILED EGG<br/>RUSSIAN ROULETTE</h1>
<div class="su">Six eggs on the plate. One has the wasabi. Tap to eat. Luck is all you have.</div>
<div class="go">TAP ANYWHERE</div>
</div>

<div id="gs" class="sc hi">
<div id="hu"><span id="sc">eggs: 0</span><span id="bb">best 0</span><span id="lv">&#9829;&#9829;&#9829;</span></div>
<div id="pl">PLATE 1</div>
<div id="tb"><div id="pt"></div></div>
<div id="mg">pick an egg.</div>
</div>

<div id="os" class="sc hi">
<h1>THE WASABI WINS</h1>
<div class="st" id="fn">you ate 0 eggs.</div>
<div class="su" id="br"></div>
<div class="su" id="ep"></div>
<div class="st" id="lgd"></div>
<div class="go">TAP TO TRY AGAIN</div>
</div>
</div>

<script>
var AC=null;
var ad=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC};
var tn=(f,d,t,v,w,s)=>{var c=ad();if(!c)return;var t0=c.currentTime+(w||0);var o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,t0);if(s)o.frequency.exponentialRampToValueAtTime(s,t0+d);g.gain.setValueAtTime(v||0.12,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+0.02)};
var pn=()=>{tn(520,0.12,'sine',0.1);tn(660,0.16,'sine',0.08,0.09)};
var pg=()=>{tn(440,0.18,'sine',0.09);tn(554,0.2,'sine',0.08,0.12);tn(659,0.28,'sine',0.07,0.24)};
var pb=()=>{tn(160,0.5,'sawtooth',0.16,0,60);tn(90,0.7,'square',0.1,0.05,40)};

var SP=[{x:26,y:24},{x:50,y:17},{x:74,y:24},{x:29,y:58},{x:50,y:65},{x:71,y:58}];
var MN=['fine.','boring.','acceptable.','tastes like nothing.','mid.','sure.','not bad actually.'];
var MH=['THAT one had the wasabi.','hot. obviously.','wrong egg.','the wasabi found you.','eyes. water. now.'];
var MC=['plate clear. more eggs.','clean plate.','survived. for now.'];
var st={sc:0,lv:3,pl:1,cu:1,bs:false,nl:0,pp:0};
var best=0;
var lg=[];

var sf=(a)=>{for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a};
var pk=(a)=>a[Math.floor(Math.random()*a.length)];
var sm=(t,b)=>{var m=document.getElementById('mg');if(!m)return;m.textContent=t;m.className=b?'bg':''};

var uh=()=>{
 var s=document.getElementById('sc'),l=document.getElementById('lv'),p=document.getElementById('pl');
 if(s)s.textContent='eggs: '+st.sc;
 if(l)l.textContent='\u2665'.repeat(Math.max(0,st.lv));
 if(p)p.textContent='PLATE '+st.pl;
 var bb=document.getElementById('bb');if(bb)bb.textContent='best '+best;
};
var cc=(p)=>{if(p>=5)return 3;if(p>=3)return 2;return 1};

var be=(cr,sp,rt)=>{
 var e=document.createElement('div');e.className='eg';
 e.style.left=sp.x+'%';e.style.top=sp.y+'%';
 e.style.marginLeft='-44px';e.style.marginTop='-35px';
 e.style.transform='rotate('+rt+'deg)';
 e.innerHTML='<div class="w"></div><div class="dl"><span class="pk"></span></div><div class="fc"><div class="ey l"><div class="pu"></div><div class="li"></div></div><div class="ey r"><div class="pu"></div><div class="li"></div></div><div class="mo"></div></div>';
 e.cr=!!cr;
 e.addEventListener('click',()=>{if(!st.bs){ad();st.bs=true;if(e.cr)ce(e);else ne(e);}});
 return e;
};

var mp=()=>{
 var p=document.getElementById('pt');if(!p)return;
 p.innerHTML='';
 var ss=sf(SP.slice());
 var dk=sf([0,1,2,3,4,5]);
 var ci={};
 for(var i=0;i<st.cu;i++)ci[dk[i]]=true;
 st.nl=6-st.cu;
 for(var j=0;j<6;j++){p.appendChild(be(ci[j],ss[j],Math.random()*16-8));}
};

var ne=(e)=>{
 pn();var f=e.querySelector('.fc');if(f)f.classList.add('hp');
 sm(pk(MN),false);e.classList.add('en');
 setTimeout(()=>{st.sc++;st.nl--;st.pp++;uh();e.remove();if(st.nl<=0)pc();else{st.bs=false;sm('pick an egg.');}},460);
};

var ce=(e)=>{
 pb();sm(pk(MH),true);
 lg.push({pl:st.pl,eg:st.pp,wa:st.pp+1});
 var a=document.getElementById('app');if(a){a.classList.remove('sa');void a.offsetWidth;a.classList.add('sa');}
 var fl=document.getElementById('fl');if(fl){fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');}
 e.classList.add('sh');
 var f=e.querySelector('.fc');if(f)f.classList.add('ot');
 setTimeout(()=>{
  e.classList.add('dd');bx(e);st.lv--;uh();
  setTimeout(()=>{
   e.remove();
   if(st.lv<=0)gv();else{st.cu=cc(st.pl);mp();sm('new plate. fresh eggs. the wasabi is still here.');st.bs=false;}
  },500);
 },500);
};

var pc=()=>{pg();sm(pk(MC),false);lg.push({pl:st.pl,eg:st.pp,wa:0});st.pp=0;setTimeout(()=>{st.pl++;st.cu=cc(st.pl);uh();mp();sm('plate '+st.pl+'. pick an egg.');st.bs=false;},900)};

var bx=(e)=>{
 var r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,h=document.getElementById('app');
 if(!h)return;
 for(var i=0;i<12;i++){
  var s=document.createElement('div');s.className='sp';
  var ang=Math.random()*Math.PI*2,dist=45+Math.random()*90;
  s.style.left=(cx-5)+'px';s.style.top=(cy-5)+'px';
  s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
  s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
  h.appendChild(s);setTimeout(()=>s.remove(),750);
 }
 for(var j=0;j<6;j++){
  var p=document.createElement('div');p.className='pf';
  var a2=Math.random()*Math.PI*2,d2=10+Math.random()*30,sz=12+Math.random()*18;
  p.style.width=sz+'px';p.style.height=sz+'px';
  p.style.left=(cx-sz/2)+'px';p.style.top=(cy-sz/2)+'px';
  p.style.setProperty('--dx',Math.cos(a2)*d2+'px');
  p.style.setProperty('--dy',(Math.sin(a2)*d2-40)+'px');
  h.appendChild(p);setTimeout(()=>p.remove(),1100);
 }
};

var gv=()=>{
 document.getElementById('gs').classList.add('hi');
 var s=document.getElementById('fn'),ep=document.getElementById('ep'),br=document.getElementById('br');
 if(s)s.textContent='you ate '+st.sc+' eggs.';
 if(br){
  var nr=st.sc>best;
  if(nr){best=st.sc;br.textContent='new record. the wasabi knows your name now.';br.style.color='#c9a83a';}
  else{br.textContent='best: '+best+' eggs.';br.style.color='';}
 }
 if(ep){
  if(st.sc<4)ep.textContent='the wasabi won. it always wins.';
  else if(st.sc<10)ep.textContent='a decent run. the wasabi respected it.';
  else ep.textContent='the wasabi is impressed. it will show no mercy next time.';
 }
 var ld=document.getElementById('lgd');
 if(ld){
  var h='';
  var lv2=lg.slice(-6);
  if(lg.length>6)h+='<div class="ll">+ '+(lg.length-6)+' EARLIER ENTRIES</div>';
  for(var i=0;i<lv2.length;i++){
   var en=lv2[i];
   h+='<div class="ll">PLATE '+en.pl+' &middot; '+en.eg+' EGG'+(en.eg===1?'':'S')+(en.wa>0?' &middot; WASABI ON EGG '+en.wa:' &middot; PLATE CLEAR')+'</div>';
  }
  h+='<div class="ls">signed, the wasabi. your name is in the book.</div>';
  ld.innerHTML=h;
 }
 document.getElementById('os').classList.remove('hi');
};

var sg=()=>{
 st.sc=0;st.lv=3;st.pl=1;st.cu=1;st.bs=false;st.pp=0;lg=[];
 document.getElementById('ts').classList.add('hi');
 document.getElementById('os').classList.add('hi');
 document.getElementById('gs').classList.remove('hi');
 uh();mp();sm('pick an egg.');
};

document.getElementById('ts').addEventListener('click',sg);
document.getElementById('os').addEventListener('click',sg);
</script>
</body>
</html>
